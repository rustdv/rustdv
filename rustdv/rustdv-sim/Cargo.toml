[package]
name = "rustdv-sim"
version = "0.2.0"
edition = "2021"
description = "The cocotb-analog core: simulator-driven async executor, tasks, triggers, typed handles, clock, sim-aware queues (design-doc §4)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustdv/rustdv"

[lib]
# Crate root named after the crate, not lib.rs (D29).
path = "src/rustdv_sim.rs"

[dependencies]
libloading = "0.8"
rustdv-gpi = { path = "../rustdv-gpi", version = "0.2.0" }

[dev-dependencies]
rustdv-vpi-stubs = { path = "../rustdv-vpi-stubs", version = "0.2.0" }
