[book]
title = "Rust for RTL Verification"
authors = ["Ray Salemi"]
language = "en"
description = "A complete course in Rust and rustdv"

[output.html]
additional-css = ["github-markdown.css"]


[output.pdf]
# Allow HTML-only checks where mdbook-pdf/Chrome is unavailable. Release
# preparation still requires a fresh PDF; see README.md before replacing
# the distributed Rust4RTLVerif.pdf.
optional = true
print-background = true
display-header-footer = true
footer-template = "<div style='font-size:9px; width:100%; text-align:center; color:#555;'><span class='pageNumber'></span> / <span class='totalPages'></span></div>"
header-template = "<span></span>"
margin-bottom = 0.7

